# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


# Other examples of plugins you might want to include
set -g @plugin 'tmux-plugins/tmux-resurrect'



set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Fixes
resurrect_dir="$HOME/.tmux/plugins/tmux-resurrect/"
set -g @resurrect-dir $resurrect_dir
set -g @resurrect-hook-post-save-all 'target=$(readlink -f $resurrect_dir/last); sed "s| --cmd .*-vim-pack-dir||g; s|/etc/profiles/per-user/$USER/bin/||g; s|/home/$USER/.nix-profile/bin/||g" $target | sponge $target'

# for vim
set -g @resurrect-strategy-vim 'session'

# for neovim
set -g @resurrect-strategy-nvim 'session'

# For page contect thingies
set -g @resurrect-capture-pane-contents 'on'

# Setting
set -g default-shell ~/.cargo/bin/nu
set -g default-command ~/.cargo/bin/nu
set -g status off

# Remaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind-key p switch-client -t docker \; run-shell "mandocks"
